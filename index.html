<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Hopper</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d1a; color: #e8eaff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 2px; color: #ffd36b; }
  canvas { background: linear-gradient(#10143a, #1b1050 70%, #301560); border-radius: 12px; max-width: 96vw; touch-action: none; box-shadow: 0 0 40px #5b3fff55; }
  p { margin: 0; font-size: 13px; opacity: .75; }
</style>
</head>
<body>
<h1>★ STAR HOPPER ★</h1>
<canvas id="c" width="420" height="640"></canvas>
<p>You bounce automatically. ← → / A D or drag to steer. Grab stars (+25), dodge comets, don't fall!</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let best = 0;
try { best = +localStorage.getItem('starhopper_best') || 0; } catch (e) {}

const ACCEL = .6, DAMP = .88, GRAV = .45, BOUNCE = -12.5, ROCKET_VY = -13;
const bot = { bestCam: 0, progressAt: 0, exploreUntil: 0, hold: null, holdLeft: 0, on: false, speed: 1, runs: 0, last: 0, best: 0, waiting: false, restartIn: 0 };
let bonusTotal = 0, player, platforms, stars, comets, items, parts, camY, state = 'title', keys = {}, targetX = null, t = 0, bg, muted = false, shake = 0;

// ---- tiny WebAudio sfx (no files needed) ----
let ac = null;
function beep(freq, dur = .1, type = 'square', vol = .06, slide = 0) {
  if (muted || (bot.on && bot.speed > 1)) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  bounce: () => beep(320, .09, 'sine', .07, 220),
  star: () => { beep(880, .08, 'triangle', .08); setTimeout(() => beep(1320, .12, 'triangle', .08), 60); },
  power: () => { beep(440, .1, 'sawtooth', .05, 440); setTimeout(() => beep(880, .15, 'sawtooth', .05, 400), 90); },
  shield: () => beep(200, .2, 'square', .08, -120),
  die: () => beep(300, .6, 'sawtooth', .09, -260),
};

function burst(x, y, color, n = 10, speed = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = Math.random() * speed + .5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30 + Math.random() * 20, color });
  }
}

function reset() {
  player = { x: W / 2, y: H - 120, vx: 0, vy: -11, r: 14, shield: false, rocket: 0 };
  platforms = []; stars = []; comets = []; items = []; parts = []; shake = 0;
  camY = 0; bonusTotal = 0; state = 'play'; bot.bestCam = 0; bot.progressAt = t; bot.exploreUntil = 0; bot.hold = null;
  platforms.push({ x: W / 2 - 40, y: H - 80, w: 80, kind: 'solid' });
  let y = H - 160;
  while (y > -H) { spawnRow(y); y -= 70; }
  bg = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.8 + .4 }));
}

function spawnRow(y) {
  const w = 60 + Math.random() * 30;
  const x = Math.random() * (W - w);
  const r = Math.random();
  const kind = r < .15 ? 'crumble' : r < .3 ? 'moving' : 'solid';
  platforms.push({ x, y, w, kind, dir: Math.random() < .5 ? 1 : -1, gone: false });
  if (Math.random() < .55) stars.push({ x: x + w / 2, y: y - 30, got: false });
  if (Math.random() < .07) items.push({ x: x + w / 2, y: y - 34, kind: Math.random() < .5 ? 'shield' : 'rocket', got: false });
  if (Math.random() < .18 && y < H - 400 - camY * 0) comets.push({ x: Math.random() * W, y: y - 40, vx: (Math.random() - .5) * 2.4 });
}

function startOrRestart() { if (state === 'title' || state === 'over') reset(); }
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); startOrRestart(); }
  if (k === 'm') muted = !muted;
  if (k === 'b') { bot.on = !bot.on; bot.waiting = false; bot.speed = 1; if (bot.on && (state === 'title' || state === 'over')) reset(); }
  if (bot.on && (k === '1' || k === '2' || k === '3')) bot.speed = [1, 4, 16][+k - 1];
  if (k === 'p' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false);
function pointer(e) {
  const rect = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  targetX = (p.clientX - rect.left) / rect.width * W;
}
cv.addEventListener('pointerdown', e => { if (state !== 'play') { startOrRestart(); return; } pointer(e); });
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') pointer(e); });
cv.addEventListener('pointerup', () => targetX = null);

// ---------------- BOT ----------------
// Every frame: simulate ~27 candidate steering plans [dir, switchAfterFrames, dir2] with the
// game's own physics (platforms, moving + crumbling platforms, comets, pickups), then take the
// first move of the best plan. If it makes no upward progress for ~6s it makes a few random
// (but verified-safe) moves to shake loose.
const BOT_PLANS = (() => {
  const plans = [[0, 999, 0], [-1, 999, -1], [1, 999, 1]];
  for (const a of [-1, 0, 1]) for (const b of [-1, 0, 1]) if (a !== b) for (const k of [6, 14, 28, 50]) plans.push([a, k, b]);
  return plans;
})();

function botSim(a, k1, b) {
  let x = player.x, y = player.y, vx = player.vx, vy = player.vy;
  let shield = player.shield, rocket = player.rocket, cam = camY;
  const lo = y - 460, hi = y + 260;
  const pl = [];
  for (const p of platforms) if (p.y > lo && p.y < hi && !p.gone) pl.push({ x: p.x, y: p.y, w: p.w, kind: p.kind, dir: p.dir, gone: false });
  const cs = [];
  for (const c of comets) if (!c.dead && c.y > lo && c.y < hi) cs.push({ x: c.x, y: c.y, vx: c.vx });
  const st = [];
  for (const s of stars) if (!s.got && s.y > lo && s.y < hi) st.push(s);
  const it = [];
  for (const i of items) if (!i.got && i.y > lo && i.y < hi) it.push(i);
  const stGot = new Array(st.length).fill(false), itGot = new Array(it.length).fill(false);
  let top = y, bounces = 0, bonus = 0;
  for (let f = 0; f < 170; f++) {
    vx = (vx + (f < k1 ? a : b) * ACCEL) * DAMP;
    x += vx; if (x < -10) x = W + 10; if (x > W + 10) x = -10;
    if (rocket > 0) { rocket--; vy = ROCKET_VY; } else vy += GRAV;
    y += vy;
    if (vy > 0) {
      for (const p of pl) {
        if (p.gone) continue;
        if (x > p.x - 6 && x < p.x + p.w + 6 && y + 14 > p.y && y + 14 < p.y + 16 + vy) {
          vy = BOUNCE; bounces++;
          if (p.kind === 'crumble') { p.gone = true; bonus -= 12; }
          break;
        }
      }
    }
    for (const p of pl) if (p.kind === 'moving') { p.x += p.dir * 1.2; if (p.x < 0 || p.x + p.w > W) p.dir *= -1; }
    for (let i = 0; i < st.length; i++) if (!stGot[i] && Math.hypot(st[i].x - x, st[i].y - y) < 24) { stGot[i] = true; bonus += 30; }
    for (let i = 0; i < it.length; i++) if (!itGot[i] && Math.hypot(it[i].x - x, it[i].y - y) < 24) {
      itGot[i] = true;
      // A rocket flies ~1400px blind and can end beside an unseen comet, so only take one while holding a shield (it absorbs that hit).
      if (it[i].kind === 'shield') { shield = true; bonus += 60; } else if (shield) { rocket = 110; bonus += 80; } else return -1e5 + f;
    }
    for (const c of cs) {
      if (c.dead) continue;
      c.x += c.vx; if (c.x < 0 || c.x > W) c.vx *= -1;
      if (Math.hypot(c.x - x, c.y - y) < 26) {
        if (shield || rocket > 0) { c.dead = true; if (rocket <= 0) { shield = false; bonus -= 40; } else bonus += 40; }
        else return -1e6 + f;
      }
    }
    if (y < top) top = y;
    if (y < cam + H * .4) cam = y - H * .4;
    if (y - cam > H + 60) return -1e6 + f;
    if (bounces >= 2 && vy < 0) break;
  }
  return -top + bonus + (bounces ? 0 : -300);
}

function botDecide() {
  // stuck-breaker bookkeeping
  if (camY < bot.bestCam - 1) { bot.bestCam = camY; bot.progressAt = t; }
  if (!bot.exploreUntil && t - bot.progressAt > 360) { bot.exploreUntil = t + 180; bot.hold = null; }
  if (bot.exploreUntil && t >= bot.exploreUntil) { bot.exploreUntil = 0; bot.progressAt = t; }

  if (bot.exploreUntil) {
    if (bot.hold) { bot.holdLeft--; if (bot.holdLeft <= 0 || botSim(...bot.hold) < -1e5) bot.hold = null; }
    if (!bot.hold) {
      const ok = BOT_PLANS.filter(p => botSim(p[0], p[1], p[2]) > -1e5);
      const pool = ok.length ? ok : BOT_PLANS;
      bot.hold = pool[(Math.random() * pool.length) | 0].slice();
      bot.holdLeft = 20 + ((Math.random() * 30) | 0);
    }
    const dir = bot.hold[0];
    bot.hold[1]--; if (bot.hold[1] <= 0) bot.hold = [bot.hold[2], 999, bot.hold[2]];
    return dir;
  }

  let best = -Infinity, dir = 0;
  for (const [a, k, b] of BOT_PLANS) {
    const sc = botSim(a, k, b) - (a !== 0 ? .5 : 0);
    if (sc > best) { best = sc; dir = a; }
  }
  return dir;
}

function finalScore() { return Math.max(0, Math.floor(-camY / 10)) + bonusTotal; }

function update() {
  t++;
  if (state === 'over' && bot.on) {
    if (!bot.waiting) { bot.waiting = true; bot.restartIn = 60; bot.runs++; bot.last = finalScore(); bot.best = Math.max(bot.best, bot.last); }
    else if (--bot.restartIn <= 0) { bot.waiting = false; reset(); }
  }
  if (shake > 0 && state !== 'play') shake--;
  if (state !== 'play') return;
  if (bot.on) player.vx += botDecide() * ACCEL;
  else {
    if (keys.ArrowLeft || keys.a) player.vx -= ACCEL;
    if (keys.ArrowRight || keys.d) player.vx += ACCEL;
    if (targetX !== null) player.vx += Math.sign(targetX - player.x) * Math.min(ACCEL, Math.abs(targetX - player.x) / 20);
  }
  player.vx *= DAMP;
  player.x += player.vx;
  if (player.x < -10) player.x = W + 10;
  if (player.x > W + 10) player.x = -10;

  if (player.rocket > 0) { player.rocket--; player.vy = ROCKET_VY; if (t % 2 === 0) burst(player.x, player.y + 14, '#ffb04a', 2, 1.5); }
  else player.vy += GRAV;
  player.y += player.vy;
  player.onGround = false;

  if (player.vy > 0) {
    for (const p of platforms) {
      if (p.gone) continue;
      if (player.x > p.x - 6 && player.x < p.x + p.w + 6 &&
          player.y + player.r > p.y && player.y + player.r < p.y + 16 + player.vy) {
        player.vy = BOUNCE; player.onGround = true; sfx.bounce(); burst(player.x, p.y, '#7dff9a', 6, 2);
        if (p.kind === 'crumble') p.gone = true;
        break;
      }
    }
  }
  for (const p of platforms) if (p.kind === 'moving') { p.x += p.dir * 1.2; if (p.x < 0 || p.x + p.w > W) p.dir *= -1; }

  for (const s of stars) if (!s.got && Math.hypot(s.x - player.x, s.y - player.y) < 24) { s.got = true; bonusTotal += 25; sfx.star(); burst(s.x, s.y, '#ffd36b', 12, 3); }
  for (const c of comets) {
    c.x += c.vx; if (c.x < 0 || c.x > W) c.vx *= -1;
    if (!c.dead && Math.hypot(c.x - player.x, c.y - player.y) < 22) {
      if (player.shield || player.rocket > 0) {
        c.dead = true; player.shield = false; bonusTotal += 40; sfx.shield(); shake = 10; burst(c.x, c.y, '#ff5a7a', 20, 4);
      } else { state = 'over'; sfx.die(); shake = 16; burst(player.x, player.y, '#b9a6ff', 30, 5); }
    }
  }
  for (const it of items) if (!it.got && Math.hypot(it.x - player.x, it.y - player.y) < 24) {
    it.got = true; sfx.power(); burst(it.x, it.y, '#6be3ff', 14, 3);
    if (it.kind === 'shield') player.shield = true; else player.rocket = 110;
  }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .08; p.life--; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake--;

  if (player.y < camY + H * .4) camY = player.y - H * .4;
  const height = Math.floor(-camY / 10);
  player.height = height;

  while (platforms.length && platforms[0].y > camY + H + 60) platforms.shift();
  let topY = Math.min(...platforms.map(p => p.y));
  while (topY > camY - 120) { topY -= 70 - Math.min(20, height / 80); spawnRow(topY); }
  stars = stars.filter(s => s.y < camY + H + 60);
  comets = comets.filter(c => !c.dead && c.y < camY + H + 60);
  items = items.filter(i => !i.got && i.y < camY + H + 60);

  if (state === 'play' && player.y - camY > H + 60) { state = 'over'; sfx.die(); }
  if (state === 'over') {
    const total = height + bonusTotal;
    if (!bot.on && total > best) { best = total; try { localStorage.setItem('starhopper_best', best); } catch (e) {} }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bg) {
    const y = ((b.y - camY * b.s * .15) % H + H) % H;
    ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 40 + b.x));
    ctx.fillStyle = '#fff'; ctx.fillRect(b.x, y, b.s, b.s);
  }
  ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(shake ? (Math.random() - .5) * shake : 0, -camY + (shake ? (Math.random() - .5) * shake : 0));

  for (const p of platforms) {
    if (p.gone) continue;
    ctx.fillStyle = p.kind === 'crumble' ? '#c98a5a' : p.kind === 'moving' ? '#6be3ff' : '#7dff9a';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 10, 5); ctx.fill();
  }
  ctx.shadowBlur = 0;
  for (const s of stars) if (!s.got) {
    ctx.fillStyle = '#ffd36b'; ctx.shadowColor = '#ffd36b'; ctx.shadowBlur = 14;
    star(s.x, s.y, 10, 4.5, 5, t / 30);
  }
  for (const it of items) {
    const bob = Math.sin(t / 12) * 3;
    ctx.shadowBlur = 16;
    if (it.kind === 'shield') {
      ctx.strokeStyle = '#6be3ff'; ctx.shadowColor = '#6be3ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(it.x, it.y + bob, 10, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffb04a'; ctx.shadowColor = '#ffb04a';
      ctx.beginPath(); ctx.moveTo(it.x, it.y + bob - 12); ctx.lineTo(it.x + 8, it.y + bob + 8); ctx.lineTo(it.x - 8, it.y + bob + 8); ctx.closePath(); ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
  for (const c of comets) {
    ctx.shadowColor = '#ff5a7a'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff5a7a';
    ctx.beginPath(); ctx.arc(c.x, c.y, 11, 0, 7); ctx.fill();
    ctx.globalAlpha = .35; ctx.beginPath(); ctx.moveTo(c.x - 9, c.y); ctx.lineTo(c.x - c.vx * 14, c.y - 28); ctx.lineTo(c.x + 9, c.y); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;
  // player: little rocket-frog
  ctx.fillStyle = '#b9a6ff'; ctx.shadowColor = '#b9a6ff'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#0b0d1a';
  ctx.beginPath(); ctx.arc(player.x - 5, player.y - 3, 3, 0, 7); ctx.arc(player.x + 5, player.y - 3, 3, 0, 7); ctx.fill();
  ctx.fillRect(player.x - 5, player.y + 4, 10, 2);
  if (player.shield) { ctx.strokeStyle = '#6be3ffcc'; ctx.lineWidth = 3; ctx.shadowColor = '#6be3ff'; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 7, 0, 7); ctx.stroke(); ctx.shadowBlur = 0; }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / 40); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();

  const height = Math.max(0, Math.floor(-camY / 10));
  ctx.fillStyle = '#e8eaff'; ctx.font = 'bold 18px system-ui';
  ctx.fillText(`Score ${height + bonusTotal}`, 14, 28);
  ctx.textAlign = 'right'; ctx.fillText(`Best ${best}`, W - 14, 28); ctx.textAlign = 'left';
  ctx.font = '13px system-ui';
  if (state !== 'title') {
    if (player.shield) { ctx.fillStyle = '#6be3ff'; ctx.fillText('SHIELD', 14, 48); }
    if (player.rocket > 0) { ctx.fillStyle = '#ffb04a'; ctx.fillText(`ROCKET ${(player.rocket / 60).toFixed(1)}s`, player.shield ? 74 : 14, 48); }
  }
  ctx.fillStyle = '#e8eaff88'; ctx.textAlign = 'right'; ctx.fillText(muted ? 'M: sound off' : 'M: mute · P: pause · B: bot', W - 14, 48); ctx.textAlign = 'left';
  if (bot.on) {
    ctx.fillStyle = '#7dff9a'; ctx.font = 'bold 13px system-ui';
    ctx.fillText(`BOT  x${bot.speed}  (1/2/3 = speed)  runs ${bot.runs}  last ${bot.last}  best ${bot.best}`, 14, H - 14);
  }

  if (state === 'title' || state === 'pause') {
    ctx.fillStyle = '#0b0d1acc'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd36b'; ctx.font = 'bold 40px system-ui';
    ctx.fillText(state === 'pause' ? 'Paused' : 'STAR HOPPER', W / 2, H / 2 - 70);
    ctx.fillStyle = '#e8eaff'; ctx.font = '16px system-ui';
    const lines = state === 'pause' ? ['Press P to resume'] : [
      'Bounce up through the stars.',
      '', '★ Star = +25', 'Blue ring = shield (survives a comet)', 'Orange triangle = rocket boost', 'Red comets = bad news', '',
      'Tap or press Space to start', 'Press B to watch the bot play'];
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 30 + i * 24));
    ctx.textAlign = 'left';
  }

  if (state === 'over') {
    ctx.fillStyle = '#0b0d1acc'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd36b'; ctx.font = 'bold 34px system-ui'; ctx.fillText('Lost in space!', W / 2, H / 2 - 20);
    ctx.fillStyle = '#e8eaff'; ctx.font = '20px system-ui';
    ctx.fillText(`Final score ${height + bonusTotal}`, W / 2, H / 2 + 16);
    ctx.font = '15px system-ui'; ctx.fillText('Tap or press Space to try again', W / 2, H / 2 + 50);
    ctx.textAlign = 'left';
  }
}
function star(x, y, R, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
}

function loop() { const n = bot.on ? bot.speed : 1; for (let i = 0; i < n; i++) update(); draw(); requestAnimationFrame(loop); }
reset(); state = 'title'; loop();
</script>
</body>
</html>
